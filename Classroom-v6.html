<body><div class="shell">
<header class="top"><div class="brand"><span class="logo">✦</span><span>Classroom</span></div><div class="muted small">School planner · v6.0 <span aria-hidden="true">✧</span></div></header>
<nav class="nav" aria-label="Main navigation"><button data-view="dashboard" class="active">Overview</button><button data-view="classes">Classes & grades</button><button data-view="tasks">Homework</button><button data-view="calendar">Calendar</button><button data-view="settings">Settings & backup</button></nav>
<section class="view active" id="dashboard"></section><section class="view" id="classes"></section><section class="view" id="tasks"></section><section class="view" id="calendar"></section><section class="view" id="settings"></section>
<footer class="app-footer">Made for your school year · Free · Private · Saved on this device</footer></div>
<div class="modal-wrap" id="modalWrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
(()=>{'use strict';
const KEY='classroom_planner_v1';const PALETTE=['#5378ec','#17a18d','#e08b3d','#a26be1','#db628c','#3d9bd0','#7b9a40'];
const stateDefault=()=>({version:1,classes:[],grades:[],tasks:[]});let data=load();let active='dashboard';let selectedClass=null;let classTab='grades';let month=new Date(new Date().getFullYear(),new Date().getMonth(),1);let taskFilter='open';let calendarMode='month';let weekStart=startOfWeek(new Date());
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.classes)&&Array.isArray(raw.grades)&&Array.isArray(raw.tasks))return raw;}catch(e){}return stateDefault()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));cloudChanged()}catch(e){alert('Could not save locally. Browser storage may be full or disabled. Export a backup and check browser settings.')}}
function id(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return 'No due date';const d=new Date(s+'T12:00:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined})}
function classById(i){return data.classes.find(c=>c.id===i)}
function gradePct(g){return g.pointsPossible>0?100*g.pointsEarned/g.pointsPossible:0}
function letter(n){return n==null?'—':n>=90?'A':n>=80?'B':n>=70?'C':n>=60?'D':'F'}
function pct(n){return n==null?'—':Number(n.toFixed(1))+'%'}
function categoryStats(c,extra){const items=data.grades.filter(g=>g.classId===c.id).concat(extra?[extra]:[]);return (c.categories||[]).map(cat=>{const subset=items.filter(g=>g.categoryId===cat.id&&Number(g.pointsPossible)>0);const earned=subset.reduce((s,g)=>s+Number(g.pointsEarned),0);const possible=subset.reduce((s,g)=>s+Number(g.pointsPossible),0);const equal=c.gradeMethod==='equal';return {...cat,earned,possible,average:subset.length?(equal?subset.reduce((sum,g)=>sum+gradePct(g),0)/subset.length:possible>0?earned/possible*100:null):null,count:subset.length}})}
function average(c,extra){if(!c)return null;const cats=categoryStats(c,extra),graded=cats.filter(x=>x.average!==null&&x.weight>0);const totalWeight=graded.reduce((s,x)=>s+Number(x.weight),0);return totalWeight>0?graded.reduce((s,x)=>s+x.average*x.weight,0)/totalWeight:null}
function goal(c){const n=Number(c.goal);return Number.isFinite(n)&&n>=0&&n<=100?n:90}
function courseBonus(c){return ({regular:0,honors:0.5,ap:1,dual:1})[c.level||'regular']??0}
function gradePoints(n){if(n==null)return null;return n>=90?4:n>=80?3:n>=70?2:n>=60?1:0}
function gpa(){let credits=0,weighted=0,unweighted=0;for(const c of data.classes){const a=average(c),gp=gradePoints(a),cr=Number(c.credits??1);if(gp===null||!(cr>0))continue;credits+=cr;unweighted+=gp*cr;weighted+=(gp+courseBonus(c))*cr}return credits?{unweighted:unweighted/credits,weighted:weighted/credits,count:credits}:null}
function goalStatus(c){const a=average(c);if(a===null)return 'Add grades to track';if(a>=goal(c))return 'On target';return (goal(c)-a).toFixed(1)+' pts to goal'}
function gradeTrend(c){const entries=data.grades.filter(g=>g.classId===c.id).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.id.localeCompare(b.id));if(!entries.length)return [];const sums=new Map,points=[];for(const g of entries){const st=sums.get(g.categoryId)||{earned:0,possible:0,percent:0,count:0};st.earned+=Number(g.pointsEarned);st.possible+=Number(g.pointsPossible);st.percent+=gradePct(g);st.count++;sums.set(g.categoryId,st);let total=0,w=0;for(const cat of c.categories){const v=sums.get(cat.id);if(v&&v.possible>0&&Number(cat.weight)>0){total+=(c.gradeMethod==='equal'?v.percent/v.count:v.earned/v.possible*100)*Number(cat.weight);w+=Number(cat.weight)}}if(w>0)points.push({y:total/w,date:g.date||'',title:g.title})}return points}
function chart(c){const pts=gradeTrend(c);if(!pts.length)return '<div class="empty">Add grades to see your grade history.</div>';const W=620,H=235,L=43,R=16,T=15,B=30,ys=pts.map(p=>p.y).concat(goal(c)),low=Math.min(0,Math.floor(Math.min(...ys)/10)*10),high=Math.max(100,Math.ceil(Math.max(...ys)/10)*10),ym=y=>T+(H-T-B)*(high-y)/(high-low),xm=i=>L+(W-L-R)*(pts.length===1?.5:i/(pts.length-1)),line=pts.map((p,i)=>(i?'L':'M')+xm(i).toFixed(1)+','+ym(p.y).toFixed(1)).join(' '),targetY=ym(goal(c));let ticks='';for(let k=0;k<=4;k++){const v=low+(high-low)*k/4,y=ym(v);ticks+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e7edf5"/><text x="${L-8}" y="${y+4}" text-anchor="end" fill="#8090a5" font-size="11">${Number(v.toFixed(0))}</text>`}return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Historical weighted course averages from ${pct(pts[0].y)} to ${pct(pts.at(-1).y)} with ${goal(c)}% goal"><g>${ticks}</g><line x1="${L}" x2="${W-R}" y1="${targetY}" y2="${targetY}" stroke="#17a18d" stroke-dasharray="5,5" stroke-width="2"/><path d="${line}" fill="none" stroke="#4269e7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${xm(i)}" cy="${ym(p.y)}" r="${pts.length>35?2:3.5}" fill="#4269e7"><title>${esc(p.title)}: ${pct(p.y)} (${esc(p.date)})</title></circle>`).join('')}</svg></div><div class="chart-key"><span>First: ${fmtDate(pts[0].date)} (${pct(pts[0].y)})</span><span style="color:#17836b">Dashed = ${goal(c)}% goal</span><span>Latest: ${pct(pts.at(-1).y)}</span></div><p class="helper">Trend reflects the average after each saved grade. Dates determine order; this is not a prediction.</p>`}
function requiredScore(c,categoryId,possible,target){if(!c||!(possible>0)||!Number.isFinite(target))return null;const cats=categoryStats(c),cat=cats.find(x=>x.id===categoryId);if(!cat||Number(cat.weight)<=0)return null;const active=cats.filter(x=>(x.possible>0||x.id===categoryId)&&Number(x.weight)>0),weight=active.reduce((s,x)=>s+Number(x.weight),0);if(!weight)return null;let others=0;for(const item of active){if(item.id!==categoryId)others+=(item.earned/item.possible*100)*Number(item.weight)}const neededCategory=(target*weight-others)/Number(cat.weight);return c.gradeMethod==='equal' ? (neededCategory*(cat.count+1)-cat.average*cat.count) : (neededCategory/100*(cat.possible+possible)-cat.earned)/possible*100}

// Bulk Skyward import: paste copied rows or read a screenshot with in-browser OCR.
// All candidates must be reviewed and explicitly saved; nothing is imported automatically.
let bulkRows=[];
const skyDate=x=>{const m=String(x||'').match(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/);return m?`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`:localDate()};
function normalizeSkyLabel(label){const v=String(label||'').toLowerCase().trim();if(/major|test|exam/.test(v))return 'major';if(/minor|quiz|lab/.test(v))return 'minor';if(/other|homework|daily|worksheet|assignment/.test(v))return 'other';return 'unknown'}
function guessCat(c,label,title=''){
 const name=String(label||'').trim().toLowerCase();
 const exact=c.categories.find(k=>k.name.toLowerCase()===name);if(exact)return exact.id;
 const kind=normalizeSkyLabel(label||title);
 const pattern=kind==='major'?/major|test|exam/i:kind==='minor'?/minor|quiz|lab/i:kind==='other'?/homework|daily|other|worksheet|assignment/i:null;
 return (pattern&&c.categories.find(k=>pattern.test(k.name))?.id)||'';
}
function skyCategoryFromLine(line){const match=String(line).match(/^\s*(major grade|minor grade|other grade|homework|daily grade)\b/i);return match?match[1]:''}
function parseBulk(text,c){let category='',rows=[];
  for(const original of text.split(/\r?\n/)){
    let line=original.trim();if(!line)continue;
    if(skyCategoryFromLine(line)){category=skyCategoryFromLine(line);continue}
    if(/^(description|due date|grade\s+score|points earned|attempts|student grades|calculations|grading scale)\b/i.test(line))continue;
    // Skyward copied lines: Assignment TAB date TAB grade TAB score TAB earned/possible TAB attempts.
    let cells=line.split(/\t+/).map(z=>z.trim()).filter(Boolean);
    let title='',date='',earned=null,possible=100;
    if(cells.length>=2){
      title=cells[0];const d=cells.find(z=>/\b\d{1,2}\/\d{1,2}\/\d{4}\b/.test(z));date=d?skyDate(d):localDate();
      const point=cells.find(z=>/^\s*\d+(?:\.\d+)?\s*\/\s*\d+(?:\.\d+)?\s*$/.test(z));
      if(point){const mm=point.match(/([\d.]+)\s*\/\s*([\d.]+)/);earned=Number(mm[1]);possible=Number(mm[2]);}
      else{let afterDate=d?cells.slice(cells.indexOf(d)+1):cells.slice(1);const score=afterDate.find(z=>/^\d+(?:\.\d+)?%?$/.test(z));if(score)earned=Number(score.replace('%',''));}
    }else{
      const m=line.match(/^(.+?)\s+(\d{1,2}\/\d{1,2}\/\d{4})\s+(\d+(?:\.\d+)?)(?:\s+\d+(?:\.\d+)?\s*%)?(?:\s+(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?))?/);
      if(m){title=m[1];date=skyDate(m[2]);earned=m[4]!=null?Number(m[4]):Number(m[3]);possible=m[5]!=null?Number(m[5]):100;}
      else{
        // Plain list: Test Name | 95 | (optional category) | (optional date)
        const parts=line.split(/\s*\|\s*|\s*,\s*/);if(parts.length>=2&&/^\d+(?:\.\d+)?%?$/.test(parts[1])){title=parts[0];earned=Number(parts[1].replace('%',''));category=parts[2]||category;date=skyDate(parts[3]);}
      }
    }
    if(!title||!Number.isFinite(earned)||earned<0||!Number.isFinite(possible)||possible<=0)continue;
    if(/^(major grade|minor grade|other grade|total|average)$/i.test(title.trim()))continue;
    rows.push({title:title.trim(),date:date||localDate(),earned,possible,sourceCategory:category||'Unlabeled',categoryId:guessCat(c,category,title),checked:true});
  }
  return rows;
}

 <div id="bulkStatus" class="helper" style="margin:12px 0" aria-live="polite">Screenshots use Tesseract.js text recognition in your browser. Internet is required to load the OCR library the first time; the screenshot is not sent to an AI service.</div>
 <div id="bulkReview"></div><div class="form-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" id="bulkSave" disabled>Save reviewed grades</button></div>`);
 // Widen for editing and undo on modal close.

    const result=await window.Tesseract.recognize(file,'eng');const txt=result.data.text||'';document.getElementById('bulkText').value=txt;bulkRows=parseBulk(txt,c);renderBulkReview(c);status.textContent=`OCR completed. Found ${bulkRows.length} possible grades; please correct anything it misread before saving.`;
  }catch(e){status.textContent='Screenshot reading failed: '+e.message+' You can paste rows manually instead.'}finally{document.getElementById('bulkOcr').disabled=false}
 };
 document.getElementById('bulkSave').onclick=e=>{e.preventDefault();saveBulk(c)};
}
function renderBulkReview(c){const slot=document.getElementById('bulkReview'),saveBtn=document.getElementById('bulkSave');if(!slot)return;

// D2L Brightspace PDF importer: uses text-layer x/y positions, including wrapped titles across pages.
// All rows and weighting changes require explicit review and confirmation before saving.
let d2lRows=[],d2lCategories=[];
function d2lNormalize(v){return String(v||'').replace(/\s+/g,' ').trim()}
function d2lClose(a,b){return a&&b&&Math.abs(a-b)<0.02}
function d2lGroups(items){
 const words=items.filter(i=>i.str&&i.str.trim()).map(i=>({text:i.str.trim(),x:i.transform[4],y:i.transform[5]})).sort((a,b)=>b.y-a.y||a.x-b.x);
 const lines=[];for(const item of words){let line=lines.find(l=>Math.abs(l.y-item.y)<=3);if(!line){line={y:item.y,words:[]};lines.push(line)}line.words.push(item)}
 return lines.sort((a,b)=>b.y-a.y).map(l=>({y:l.y,words:l.words.sort((a,b)=>a.x-b.x),text:d2lNormalize(l.words.map(w=>w.text).join(' '))}));
}
function d2lExtract(pages){
 const rows=[],categories=[];let current=null,last=null;
 const numeric=s=>Number(String(s).replace(/,/g,''));
 for(const page of pages){
  for(const ln of d2lGroups(page)){
   const name=d2lNormalize(ln.words.filter(w=>w.x>=85&&w.x<185).map(w=>w.text).join(' '));
   const left=d2lNormalize(ln.words.filter(w=>w.x<190).map(w=>w.text).join(' '));
   const isHeader=ln.words.some(w=>w.x<85);
   const points=d2lNormalize(ln.words.filter(w=>w.x>=185&&w.x<265).map(w=>w.text).join(' '));
   const weight=d2lNormalize(ln.words.filter(w=>w.x>=270&&w.x<365).map(w=>w.text).join(' '));
   const grade=d2lNormalize(ln.words.filter(w=>w.x>=365&&w.x<420).map(w=>w.text).join(' '));
   // Category headers have a left-aligned name and a category total under Weight Achieved.
   const categoryMatch=weight.match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
   if(isHeader&&left&&categoryMatch&&!/^(?:grade|page|https|stay|listen)/i.test(left)&&!points){
    const denom=numeric(categoryMatch[2]);const cat={name:left,weight:denom>0?denom:null,reported:Number.isFinite(parseFloat(grade))?parseFloat(grade):null};
    categories.push(cat);current=cat.name;last=null;continue;
   }
   // Final Exam 0/0 may be ungraded (retain its category with null reported).
   if(isHeader&&left&&/final exam/i.test(left)&&/0\s*\/\s*0/.test(weight)){
    categories.push({name:left,weight:null,reported:null});current=left;last=null;continue;
   }
   const scoreMatch=points.match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
   if(name&&!isHeader&&scoreMatch&&current){
    const earned=numeric(scoreMatch[1]),possible=numeric(scoreMatch[2]);
    if(possible>0){last={title:name,earned,possible,sourceCategory:current,checked:true};rows.push(last)}
   } else if(name&&!points&&last&&!isHeader&&!/^(?:https|page)/i.test(name)){
    // Titles can wrap to several lines; only append lines from title column with no scores.
    last.title=d2lNormalize(last.title+' '+name);
   }
  }
 }
 return {rows,categories};
}

  try{
   if(!window.pdfjsLib){await new Promise((resolve,reject)=>{const el=document.createElement('script');el.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';el.onload=resolve;el.onerror=()=>reject(Error('Could not load PDF reader. Check your connection.'));document.head.append(el)})}
   const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

   for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);const content=await page.getTextContent();pages.push(content.items)}

function d2lRenderReview(c){
 const panel=document.getElementById('d2lReview'),button=document.getElementById('d2lSave');
 const known=d2lCategories.filter(x=>x.weight!==null&&x.weight>0);
 const sum=known.reduce((s,x)=>s+x.weight,0);

function d2lSave(c){
 const apply=document.getElementById('d2lUseWeights').checked;
 const cats=[...document.querySelectorAll('#d2lReview .d2l-cat-name')].map((el,i)=>({name:el.value.trim(),weight:Number(document.querySelectorAll('#d2lReview .d2l-cat-weight')[i].value),blank:document.querySelectorAll('#d2lReview .d2l-cat-weight')[i].value.trim()===''}));
 if(cats.some(x=>!x.name||x.blank||!Number.isFinite(x.weight)||x.weight<0||x.weight>100)||Math.abs(cats.reduce((sum,x)=>sum+x.weight,0)-100)>0.05){alert('Enter valid weights for every D2L category, totaling 100%.');return}
 if(new Set(cats.map(x=>x.name.toLowerCase())).size!==cats.length){alert('D2L category names must be unique.');return}
 const categoryMatch=new Map(cats.map(cat=>[cat.name.toLowerCase(),cat]));
 const originalNames=d2lCategories.map(x=>x.name.toLowerCase());
 const rows=[];for(const tr of document.querySelectorAll('#d2lReview tr[data-d2l]')){
  if(!tr.querySelector('.d2l-check').checked)continue;
  const r=d2lRows[Number(tr.dataset.d2l)],title=tr.querySelector('.d2l-title').value.trim(),earned=Number(tr.querySelector('.d2l-earned').value),possible=Number(tr.querySelector('.d2l-possible').value);

  let msg='';
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(u))msg='Enter your Supabase Project URL, starting with https:// and ending with .supabase.co';
  else if(!k||/^(sb_secret_|service_role)/i.test(k))msg='Enter only the Supabase publishable or legacy anon key, not a secret/service_role key.';
  if(msg){const error=document.getElementById('cloudSetupError');error.textContent=msg;error.hidden=false;return}
  localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify({url:u.replace(/\/$/,''),key:k}));
  cloudClient=null;cloudUser=null;cloudReady=false;cloudConflict=false;
  closeModal();cloudStatusSet('Connecting to your Supabase project…');renderSettings();cloudInit();
 };
}
async function cloudLogin(){if(!cloudClient){alert('Configure cloud sync first.');return}const email=prompt('Email for your private Classroom account:');if(!email)return;try{const {error}=await cloudClient.auth.signInWithOtp({email:email.trim(),options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;cloudStatusSet('Check your email for a sign-in link. Open it on this device in Safari or Chrome.')}catch(e){cloudStatusSet('Sign-in error: '+e.message)}}
async function cloudLogout(){if(!cloudClient)return;if(!confirm('Sign out of cloud sync? Your saved grades on this device will stay here.'))return;clearTimeout(cloudTimer);cloudReady=false;cloudConflict=false;cloudPending=false;const {error}=await cloudClient.auth.signOut();if(error)cloudStatusSet('Sign-out error: '+error.message);else{cloudUser=null;cloudRevision=null;cloudAccount='';cloudStatusSet('Signed out; grades remain on this device.');renderSettings()}}
async function cloudFetch(){const {data:row,error}=await cloudClient.from('classroom_data').select('payload,revision,updated_at').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;return row}
function cloudAccept(row){if(!cloudValid(row?.payload))throw Error('Cloud document is invalid. No changes were made.');data=row.payload;localStorage.setItem(KEY,JSON.stringify(data));cloudRevision=Number(row.revision);cloudPending=false;cloudLastSnapshot=JSON.stringify(data);cloudConflict=false;cloudReady=true;selectedClass=null;closeModal();render();cloudStatusSet('Up to date. Cloud revision '+cloudRevision+'.')}
async function cloudSync(){if(!cloudUser){cloudStatusSet('Please sign in first.');return}if(cloudBusy)return;cloudBusy=true;try{cloudStatusSet('Checking cloud data…');const row=await cloudFetch();if(row){if(!cloudValid(row.payload))throw Error('Cloud data is invalid. Nothing was overwritten.');const equal=JSON.stringify(row.payload)===JSON.stringify(data);
 if(equal){cloudRevision=Number(row.revision);cloudLastSnapshot=JSON.stringify(data);cloudReady=true;cloudPending=false;cloudConflict=false;cloudStatusSet('Up to date. Cloud revision '+cloudRevision+'.');return}
 if(!cloudReady){if(cloudIsBlank(data)){cloudAccept(row);return}if(confirm('Cloud data already exists. Replace your saved grades on THIS device with the cloud copy?\n\nCancel keeps your device data unchanged. Export a backup first if unsure.')){cloudAccept(row);return}cloudReady=false;cloudStatusSet('Local grades kept. Export a backup, then use “Use cloud data” or choose to overwrite cloud when ready.');cloudConflict=true;renderSettings();return}
 if(Number(row.revision)!==cloudRevision){if(!cloudPending&&cloudLastSnapshot===JSON.stringify(data)){cloudAccept(row);return}cloudConflict=true;cloudReady=false;cloudStatusSet('Conflict: your cloud data changed on another device. Your local grades are safe. Choose “Use cloud data” or “Overwrite cloud” after backing up.');renderSettings();return}
 cloudPending=true;}
 else{if(!cloudLocalHasData()){cloudRevision=null;cloudReady=true;cloudPending=false;cloudLastSnapshot=JSON.stringify(data);cloudStatusSet('Connected. Add grades and they will sync automatically.');return}if(!cloudReady&&!confirm('No cloud grades found. Upload the grades saved on THIS device to your private account?')){cloudStatusSet('Kept local grades. Connect this device when ready.');return}cloudRevision=null;cloudPending=true;cloudReady=true;}
 }catch(e){cloudStatusSet('Could not connect: '+e.message)}finally{cloudBusy=false}
 if(cloudPending)await cloudPush()}
async function cloudPush(){if(!cloudReady||!cloudUser||cloudConflict||!cloudPending||cloudBusy||!navigator.onLine)return;cloudBusy=true;clearTimeout(cloudTimer);const snapshot=JSON.parse(JSON.stringify(data));let revision=cloudRevision;cloudPending=false;try{let response;
 if(revision===null){response=await cloudClient.from('classroom_data').insert({user_id:cloudUser.id,payload:snapshot,revision:1}).select('revision').single()}
 else{response=await cloudClient.from('classroom_data').update({payload:snapshot,revision:revision+1,updated_at:new Date().toISOString()}).eq('user_id',cloudUser.id).eq('revision',revision).select('revision').maybeSingle()}
 if(response.error)throw response.error;
 if(!response.data){cloudConflict=true;cloudReady=false;cloudStatusSet('Sync conflict! Another device changed the cloud copy. Your local grades are safe. Resolve it below.');renderSettings();return}
 cloudRevision=Number(response.data.revision);cloudLastSnapshot=JSON.stringify(snapshot);cloudStatusSet('✓ Synced to your private cloud · revision '+cloudRevision);if(cloudPending)setTimeout(()=>cloudPush(),200);
 }catch(e){cloudPending=true;if(e.code==='23505'){cloudConflict=true;cloudReady=false;cloudStatusSet('Sync conflict: cloud copy was created elsewhere. Your local data is safe; resolve below.');renderSettings()}else cloudStatusSet('Could not sync: '+e.message+'. Saved locally; try “Sync now” when online.')}finally{cloudBusy=false}}
async function cloudDownload(){if(!cloudUser)return;if(!confirm('REPLACE local classes, grades, and homework with the cloud copy? Export a backup first.'))return;try{const row=await cloudFetch();if(!row){cloudStatusSet('There is no cloud copy yet.');return}cloudAccept(row)}catch(e){cloudStatusSet('Download failed: '+e.message)}}
async function cloudOverwrite(){if(!cloudUser)return;if(!confirm('OVERWRITE the cloud copy with this device’s grades? This will replace the cloud data for all your devices. First export a backup.'))return;try{const row=await cloudFetch();cloudRevision=row?Number(row.revision):null;cloudConflict=false;cloudReady=true;cloudPending=true;renderSettings();await cloudPush()}catch(e){cloudStatusSet('Could not overwrite: '+e.message)}}
window.addEventListener('online',()=>{if(cloudPending&&cloudReady)cloudPush()});
window.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudReady){if(cloudPending)cloudPush();else cloudSync()}});

document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-view]');if(!el)return;if(el.dataset.view){go(el.dataset.view);return}const a=el.dataset.action,i=el.dataset.id;switch(a){case'add-class':classForm();break;case'edit-class':classForm(i);break;case'open-class':selectedClass=i;classTab='grades';go('classes');break;case'back-classes':selectedClass=null;go('classes');break;case'add-category':document.getElementById('catRows').insertAdjacentHTML('beforeend',categoryLine());break;case'remove-category':el.closest('.weight-line').remove();break;case'add-grade':gradeForm(null,i);break;case'bulk-import':bulkImport(i);break;case'd2l-import':d2lImport(i);break;case'organize-grades':organizeGrades(i);break;case'edit-grade':gradeForm(i);break;case'add-task':taskForm();break;case'study-plan':studyPlan();break;case'edit-task':taskForm(i);break;case'class-tab':classTab=i;renderClasses();break;case'whatif-calc':recalcWhatIf();break;case'target-calc':recalcTarget();break;case'task-filter':taskFilter=i;renderTasks();break;case'calendar-mode':calendarMode=i;renderCalendar();break;case'prev-week':weekStart.setDate(weekStart.getDate()-7);renderCalendar();break;case'next-week':weekStart.setDate(weekStart.getDate()+7);renderCalendar();break;case'prev-month':month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar();break;case'next-month':month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar();break;case'close-modal':closeModal();break;case'cloud-config':cloudConfigure();break;case'cloud-login':cloudLogin();break;case'cloud-logout':cloudLogout();break;case'cloud-sync':cloudSync();break;case'cloud-download':cloudDownload();break;case'cloud-overwrite':cloudOverwrite();break;case'cloud-disable':cloudDisable();break;case'export':exportBackup();break;case'import':document.getElementById('importFile').click();break;case'reset':if(confirm('Permanently delete ALL saved classes, grades and homework on this browser? This cannot be undone unless you exported a backup.')){data=stateDefault();selectedClass=null;save();go('dashboard')}break;case'delete-class':if(confirm('Delete this class and all its saved grades? Homework will remain under General.')){data.classes=data.classes.filter(c=>c.id!==i);data.grades=data.grades.filter(g=>g.classId!==i);data.tasks.forEach(t=>{if(t.classId===i)t.classId=''});selectedClass=null;save();closeModal();go('classes')}break;case'delete-grade':if(confirm('Delete this saved grade?')){data.grades=data.grades.filter(g=>g.id!==i);save();closeModal();render()}break;case'delete-task':if(confirm('Delete this homework task?')){data.tasks=data.tasks.filter(t=>t.id!==i);save();closeModal();render()}break;}}
);
document.addEventListener('change',e=>{if(e.target.dataset.action==='toggle-task'){const t=data.tasks.find(t=>t.id===e.target.dataset.id);if(t){onToggleTask(t,e.target.checked)}}if(e.target.id==='themeChoice'){preferences().theme=e.target.value;save();applyTheme()}if(e.target.id==='reminderChoice'){preferences().reminderDays=Number(e.target.value);save();render()}if(e.target.id==='importFile')importBackup(e.target.files?.[0])});document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});applyTheme();render();registerWorker();cloudInit();
})();
</script></body></html>
