splay:flex}.modal{background:#fff;border-radius:18px;padding:23px;width:min(510px,100%);max-height:92vh;overflow:auto;box-shadow:0 22px 75px #12244b44}.modal h2{margin:0 0 11px}.weight-line{display:grid;grid-template-columns:1fr 90px 32px;gap:8px;align-items:center;margin:7px 0}.weight-line input{width:100%;border:1px solid #d9e1ee;border-radius:8px;padding:10px}.iconbtn{border:0;background:transparent;color:#a75566;font-size:21px}.grade-table{width:100%;border-collapse:collapse;font-size:13px}.grade-table th{text-align:left;color:#7c8a9c;font-weight:750;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:13px 9px;border-bottom:1px solid #e8edf3}.grade-table td{padding:13px 9px;border-bottom:1px solid #edf1f5}.grade-table tr:last-child td{border-bottom:0}.grade-table td:last-child,.grade-table th:last-child{text-align:right}.gradebar{height:7px;background:#e9eef8;border-radius:8px;overflow:hidden;margin:9px 0 5px}.gradebar span{display:block;height:100%;background:#5276ec;border-radius:8px}.category-list{display:grid;gap:10px}.category-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 13px;background:#f6f8fc;border-radius:10px}.tabs-inline{display:flex;gap:8px;margin:19px 0 13px;flex-wrap:wrap}.tabs-inline button{border:1px solid #dce3ef;background:white;padding:8px 12px;border-radius:9px;font-weight:650}.tabs-inline button.active{background:#e9efff;color:#2851ce;border-color:#cbd6ff}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday{text-align:center;font-weight:750;font-size:12px;color:#73849b;padding:9px 0}.day{min-height:98px;background:white;border:1px solid #e4eaf2;border-radius:9px;padding:7px 5px;min-width:0}.day.faded{background:#f4f6fa;color:#a4adbc}.day.today{border:2px solid #3c65e9}.date-number{font-size:12px;font-weight:700;padding-left:3px}.cal-item{display:block;text- <body><div class="shell">
<header class="top"><div class="brand"><span class="logo">✦</span><span>Classroom</span></div><div class="muted small">School planner · v4.0 <span aria-hidden="true">✧</span></div></header>
<nav class="nav" aria-label="Main navigation"><button data-view="dashboard" class="active">Overview</button><button data-view="classes">Classes & grades</button><button data-view="tasks">Homework</button><button data-view="calendar">Calendar</button><button data-view="settings">Settings & backup</button></nav>
<section class="view active" id="dashboard"></section><section class="view" id="classes"></section><section class="view" id="tasks"></section><section class="view" id="calendar"></section><section class="view" id="settings"></section>
<footer class="app-footer">Made for your school year · Free · No account · Saved on this device</footer></div>
<div class="modal-wrap" id="modalWrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
(()=>{'use strict';
const KEY='classroom_planner_v1';const PALETTE=['#5378ec','#17a18d','#e08b3d','#a26be1','#db628c','#3d9bd0','#7b9a40'];
const stateDefault=()=>({version:1,classes:[],grades:[],tasks:[]});let data=load();let active='dashboard';let selectedClass=null;let classTab='grades';let month=new Date(new Date().getFullYear(),new Date().getMonth(),1);let taskFilter='open';let calendarMode='month';let weekStart=startOfWeek(new Date());
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.classes)&&Array.isArray(raw.grades)&&Array.isArray(raw.tasks))return raw;}catch(e){}return stateDefault()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Could not save locally. Browser storage may be full or disabled. Export a backup and check browser settings.')}}
function id(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return 'No due date';const d=new Date(s+'T12:00:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined})}
function classById(i){return data.classes.find(c=>c.id===i)}
function gradePct(g){return g.pointsPossible>0?100*g.pointsEarned/g.pointsPossible:0}
function letter(n){return n==null?'—':n>=90?'A':n>=80?'B':n>=70?'C':n>=60?'D':'F'}
function pct(n){return n==null?'—':Number(n.toFixed(1))+'%'}
function categoryStats(c,extra){const items=data.grades.filter(g=>g.classId===c.id).concat(extra?[extra]:[]);return (c.categories||[]).map(cat=>{const subset=items.filter(g=>g.categoryId===cat.id);const earned=subset.reduce((s,g)=>s+Number(g.pointsEarned),0);const possible=subset.reduce((s,g)=>s+Number(g.pointsPossible),0);return {...cat,earned,possible,average:possible>0?earned/possible*100:null,count:subset.length}})}
function average(c,extra){if(!c)return null;const cats=categoryStats(c,extra),graded=cats.filter(x=>x.average!==null&&x.weight>0);const totalWeight=graded.reduce((s,x)=>s+Number(x.weight),0);return totalWeight>0?graded.reduce((s,x)=>s+x.average*x.weight,0)/totalWeight:null}
function goal(c){const n=Number(c.goal);return Number.isFinite(n)&&n>=0&&n<=100?n:90}
function courseBonus(c){return ({regular:0,honors:0.5,ap:1,dual:1})[c.level||'regular']??0}
function gradePoints(n){if(n==null)return null;return n>=90?4:n>=80?3:n>=70?2:n>=60?1:0}
function gpa(){let credits=0,weighted=0,unweighted=0;for(const c of data.classes){const a=average(c),gp=gradePoints(a),cr=Number(c.credits??1);if(gp===null||!(cr>0))continue;credits+=cr;unweighted+=gp*cr;weighted+=(gp+courseBonus(c))*cr}return credits?{unweighted:unweighted/credits,weighted:weighted/credits,count:credits}:null}
function goalStatus(c){const a=average(c);if(a===null)return 'Add grades to track';if(a>=goal(c))return 'On target';return (goal(c)-a).toFixed(1)+' pts to goal'}
function gradeTrend(c){const entries=data.grades.filter(g=>g.classId===c.id).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.id.localeCompare(b.id));if(!entries.length)return [];const sums=new Map,points=[];for(const g of entries){const st=sums.get(g.categoryId)||{earned:0,possible:0};st.earned+=Number(g.pointsEarned);st.possible+=Number(g.pointsPossible);sums.set(g.categoryId,st);let total=0,w=0;for(const cat of c.categories){const v=sums.get(cat.id);if(v&&v.possible>0&&Number(cat.weight)>0){total+=(v.earned/v.possible*100)*Number(cat.weight);w+=Number(cat.weight)}}if(w>0)points.push({y:total/w,date:g.date||'',title:g.title})}return points}
function chart(c){const pts=gradeTrend(c);if(!pts.length)return '<div class="empty">Add grades to see your grade history.</div>';const W=620,H=235,L=43,R=16,T=15,B=30,ys=pts.map(p=>p.y).concat(goal(c)),low=Math.min(0,Math.floor(Math.min(...ys)/10)*10),high=Math.max(100,Math.ceil(Math.max(...ys)/10)*10),ym=y=>T+(H-T-B)*(high-y)/(high-low),xm=i=>L+(W-L-R)*(pts.length===1?.5:i/(pts.length-1)),line=pts.map((p,i)=>(i?'L':'M')+xm(i).toFixed(1)+','+ym(p.y).toFixed(1)).join(' '),targetY=ym(goal(c));let ticks='';for(let k=0;k<=4;k++){const v=low+(high-low)*k/4,y=ym(v);ticks+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e7edf5"/><text x="${L-8}" y="${y+4}" text-anchor="end" fill="#8090a5" font-size="11">${Number(v.toFixed(0))}</text>`}return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Historical weighted course averages from ${pct(pts[0].y)} to ${pct(pts.at(-1).y)} with ${goal(c)}% goal"><g>${ticks}</g><line x1="${L}" x2="${W-R}" y1="${targetY}" y2="${targetY}" stroke="#17a18d" stroke-dasharray="5,5" stroke-width="2"/><path d="${line}" fill="none" stroke="#4269e7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${xm(i)}" cy="${ym(p.y)}" r="${pts.length>35?2:3.5}" fill="#4269e7"><title>${esc(p.title)}: ${pct(p.y)} (${esc(p.date)})</title></circle>`).join('')}</svg></div><div class="chart-key"><span>First: ${fmtDate(pts[0].date)} (${pct(pts[0].y)})</span><span style="color:#17836b">Dashed = ${goal(c)}% goal</span><span>Latest: ${pct(pts.at(-1).y)}</span></div><p class="helper">Trend reflects the average after each saved grade. Dates determine order; this is not a prediction.</p>`}
function requiredScore(c,categoryId,possible,target){if(!c||!(possible>0)||!Number.isFinite(target))return null;const cats=categoryStats(c),cat=cats.find(x=>x.id===categoryId);if(!cat||Number(cat.weight)<=0)return null;const active=cats.filter(x=>(x.possible>0||x.id===categoryId)&&Number(x.weight)>0),weight=active.reduce((s,x)=>s+Number(x.weight),0);if(!weight)return null;let others=0;for(const item of active){if(item.id!==categoryId)others+=(item.earned/item.possible*100)*Number(item.weight)}const neededCategory=(target*weight-others)/Number(cat.weight);return (neededCategory/100*(cat.possible+possible)-cat.earned)/possible*100}
function targetMarkup(c){return `<div class="two"><div class="panel"><h2 style="margin-top:0">🎯 Target grade calculator</h2><p class="muted small">Find out exactly what score you need on your next assignment to reach a class-average goal.</p><div class="field"><label for="targetCategory">Next assignment category</label><select id="targetCategory">${c.categories.filter(x=>Number(x.weight)>0).map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${x.weight}%)</option>`).join('')}</select></div><div class="field-row"><div class="field"><label for="targetGoal">Desired overall average (%)</label><input id="targetGoal" type="number" min="0" max="100" step="0.1" value="${goal(c)}"></div><div class="field"><label for="targetPossible">Next assignment grade out of</label><input id="targetPossible" type="number" min="0.01" step="0.01" value="100"></div></div><button class="btn primary" data-action="target-calc">Calculate needed score</button></div><div class="panel"><div class="stat-label">Score needed on next assignment</div><div id="targetResult" class="target-output"><div class="whatif-result">—</div><div class="small muted">Enter a target and calculate.</div></div><div class="info">Assumes all saved grades count, weighted categories use total points, and empty categories don't count until graded. Check your teacher’s actual grading rules.</div></div></div>`}
function recalcTarget(){const c=classById(selectedClass),cat=document.getElementById('targetCategory')?.value,possible=Number(document.getElementById('targetPossible')?.value),target=Number(document.getElementById('targetGoal')?.value),out=document.getElementById('targetResult');if(!c||!out||!cat||!(possible>0)||!Number.isFinite(target)||target<0||target>100){alert('Enter a valid goal (0–100) and positive points possible.');return}const req=requiredScore(c,cat,possible,target);if(req===null){out.innerHTML='<p class="notice">Unable to calculate. Check category weights.</p>';return}const status=req>100+1e-8?'Not possible with a score of 100% or less':req<0?'Goal reached even with 0% on this assignment':req>95?'Very challenging':'Achievable';const badge=req>100+1e-8?'risk':req>95?'warning':'';const display=Math.max(0,req);out.innerHTML=`<div class="whatif-result">${display.toFixed(1)}%</div><div class="goal-badge ${badge}">${status}</div><p class="small muted">${req>100?'Would require '+req.toFixed(1)+'%, unless extra credit or other grades change.':req<0?'A zero would still leave your average at or above '+target+'%.':'Score at least '+req.toFixed(2)+'% on the next '+possible+'-point assignment to reach '+target+'%.'}</p>`}
function allOpenTasks(){return data.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))}

function gradeForm(gid,cid){const g=gid?data.grades.find(x=>x.id===gid):null,c=classById(g?.classId||cid);if(!c)return;modal(g?'Edit grade':'Add a grade',`<form id="gradeForm"><div class="field"><label>Assignment / test name</label><input name="title" maxlength="120" required placeholder="e.g., Unit 4 Test" value="${esc(g?.title||'')}"></div><div class="field"><label>Category</label><select name="category">${c.categories.map(x=>`<option value="${esc(x.id)}" ${g?.categoryId===x.id?'selected':''}>${esc(x.name)} (${x.weight}%)</option>`).join('')}</select></div><div class="field-row"><div class="field"><label>Grade earned</label><input name="earned" type="number" min="0" step="0.01" required value="${g?.pointsEarned??''}" placeholder="90"></div><div class="field"><label>Grade out of</label><input name="possible" type="number" min="0.01" step="0.01" required value="${g?.pointsPossible??100}"></div></div><div class="field"><label>Date</label><input name="date" type="date" value="${esc(g?.date||localDate())}"></div><div class="form-actions">${g?`<button type="button" class="btn danger" data-action="delete-grade" data-id="${esc(g.id)}">Delete grade</button>`:''}<button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Save grade</button></div></form>`);document.getElementById('gradeForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,earned=Number(f.elements.earned.value),possible=Number(f.elements.possible.value);if(!Number.isFinite(earned)||earned<0||!Number.isFinite(possible)||possible<=0){alert('Enter a valid score and points possible.');return}const entry={title:f.elements.title.value.trim(),categoryId:f.elements.category.value,pointsEarned:earned,pointsPossible:possible,date:f.elements.date.value};if(!entry.title)return;if(g)Object.assign(g,entry);else data.grades.push({id:id(),classId:c.id,...entry});selectedClass=c.id;save();closeModal();go('classes')}}
function taskForm(tid){const t=tid?data.tasks.find(x=>x.id===tid):null;modal(t?'Edit homework':'Add homework',`<form id="taskForm"><div class="field"><label>Assignment / task</label><input name="title" required maxlength="150" placeholder="e.g., Read chapter 5" value="${esc(t?.title||'')}"></div><div class="field"><label>Class</label><select name="classId"><option value="">General / no class</option>${data.classes.map(c=>`<option value="${esc(c.id)}" ${t?.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Due date</label><input type="date" name="due" value="${esc(t?.due||localDate())}"></div><div class="field"><label>Repeat after completion</label><select name="recurrence">${[['none','Does not repeat'],['daily','Every day'],['weekly','Every week'],['biweekly','Every 2 weeks']].map(([v,label])=>`<option value="${v}" ${(t?.recurrence||'none')===v?'selected':''}>${label}</option>`).join('')}</select><div class="helper">When marked complete, Classroom creates the next occurrence. Existing copies are not changed.</div></div><div class="field"><label>Notes (optional)</label><textarea name="notes" maxlength="2000" placeholder="Extra details">${esc(t?.notes||'')}</textarea></div><div class="field"><label><input type="checkbox" name="done" ${t?.done?'checked':''} style="width:auto;margin-right:8px">Completed</label></div><div class="form-actions">${t?`<button type="button" class="btn danger" data-action="delete-task" data-id="${esc(t.id)}">Delete</button>`:''}<button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Save homework</button></div></form>`);document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,entry={title:f.elements.title.value.trim(),classId:f.elements.classId.value,due:f.elements.due.value,notes:f.elements.notes.value.trim(),done:f.elements.done.checked,recurrence:f.elements.recurrence.value};if(!entry.title)return;if(t){const wasDone=t.done;Object.assign(t,entry);if(!wasDone&&t.done)nextTask(t)}else{const task={id:id(),...entry};data.tasks.push(task);if(task.done)nextTask(task)}save();closeModal();render()}}
function recalcWhatIf(){const c=classById(selectedClass),categoryId=document.getElementById('whatifCategory')?.value,earned=Number(document.getElementById('whatifEarned')?.value),possible=Number(document.getElementById('whatifPossible')?.value);if(!c||!categoryId||!Number.isFinite(earned)||earned<0||!Number.isFinite(possible)||possible<=0){alert('Enter a valid hypothetical score.');return}const before=average(c),after=average(c,{categoryId,pointsEarned:earned,pointsPossible:possible});document.getElementById('whatifResult').textContent=pct(after)+' '+letter(after);document.getElementById('whatifNote').textContent='Current: '+pct(before)+' → Scenario: '+pct(after)+(before===null?'':` (${after>=before?'+':''}${(after-before).toFixed(1)} percentage points)`)}
function exportBackup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='classroom-backup-'+localDate()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validBackup(x){if(!x||!Array.isArray(x.classes)||!Array.isArray(x.grades)||!Array.isArray(x.tasks))return false;if(x.classes.some(c=>!c||typeof c.id!=='string'||typeof c.name!=='string'||!Array.isArray(c.categories)||c.categories.some(k=>!k||typeof k.id!=='string'||typeof k.name!=='string'||!Number.isFinite(Number(k.weight)))))return false;if(x.grades.some(g=>!g||typeof g.id!=='string'||typeof g.classId!=='string'||typeof g.categoryId!=='string'||!Number.isFinite(Number(g.pointsEarned))||!Number.isFinite(Number(g.pointsPossible))||Number(g.pointsPossible)<=0))return false;if(x.tasks.some(t=>!t||typeof t.id!=='string'||typeof t.title!=='string'))return false;return true}
async function importBackup(file){if(!file)return;try{if(file.size>5000000)throw Error('Backup is too large');const parsed=JSON.parse(await file.text());if(!validBackup(parsed))throw Error('This is not a valid Classroom backup');if(!confirm('Restore this backup? It will REPLACE all classes, grades, and tasks currently saved in this browser.'))return;data=parsed;save();selectedClass=null;closeModal();go('dashboard');alert('Backup restored successfully.')}catch(e){alert('Could not restore backup: '+e.message)}}

// Bulk Skyward import: paste copied rows or read a screenshot with in-browser OCR.
// All candidates must be reviewed and explicitly saved; nothing is imported automatically.
let bulkRows=[];
const skyDate=x=>{const m=String(x||'').match(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/);return m?`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`:localDate()};
function normalizeSkyLabel(label){const v=String(label||'').toLowerCase().trim();if(/major|test|exam/.test(v))return 'major';if(/minor|quiz|lab/.test(v))return 'minor';if(/other|homework|daily|worksheet|assignment/.test(v))return 'other';return 'unknown'}
function guessCat(c,label,title=''){
 const name=String(label||'').trim().toLowerCase();
 const exact=c.categories.find(k=>k.name.toLowerCase()===name);if(exact)return exact.id;
 const kind=normalizeSkyLabel(label||title);
 const pattern=kind==='major'?/major|test|exam/i:kind==='minor'?/minor|quiz|lab/i:kind==='other'?/homework|daily|other|worksheet|assignment/i:null;
 return (pattern&&c.categories.find(k=>pattern.test(k.name))?.id)||'';
}
function skyCategoryFromLine(line){const match=String(line).match(/^\s*(major grade|minor grade|other grade|homework|daily grade)\b/i);return match?match[1]:''}
function parseBulk(text,c){let category='',rows=[];
  for(const original of text.split(/\r?\n/)){
    let line=original.trim();if(!line)continue;
    if(skyCategoryFromLine(line)){category=skyCategoryFromLine(line);continue}
    if(/^(description|due date|grade\s+score|points earned|attempts|student grades|calculations|grading scale)\b/i.test(line))continue;
    // Skyward copied lines: Assignment TAB date TAB grade TAB score TAB earned/possible TAB attempts.
    let cells=line.split(/\t+/).map(z=>z.trim()).filter(Boolean);
    let title='',date='',earned=null,possible=100;
    if(cells.length>=2){
      title=cells[0];const d=cells.find(z=>/\b\d{1,2}\/\d{1,2}\/\d{4}\b/.test(z));date=d?skyDate(d):localDate();
      const point=cells.find(z=>/^\s*\d+(?:\.\d+)?\s*\/\s*\d+(?:\.\d+)?\s*$/.test(z));
      if(point){const mm=point.match(/([\d.]+)\s*\/\s*([\d.]+)/);earned=Number(mm[1]);possible=Number(mm[2]);}
      else{let afterDate=d?cells.slice(cells.indexOf(d)+1):cells.slice(1);const score=afterDate.find(z=>/^\d+(?:\.\d+)?%?$/.test(z));if(score)earned=Number(score.replace('%',''));}
    }else{
      const m=line.match(/^(.+?)\s+(\d{1,2}\/\d{1,2}\/\d{4})\s+(\d+(?:\.\d+)?)(?:\s+\d+(?:\.\d+)?\s*%)?(?:\s+(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?))?/);
      if(m){title=m[1];date=skyDate(m[2]);earned=m[4]!=null?Number(m[4]):Number(m[3]);possible=m[5]!=null?Number(m[5]):100;}
      else{
        // Plain list: Test Name | 95 | (optional category) | (optional date)
        const parts=line.split(/\s*\|\s*|\s*,\s*/);if(parts.length>=2&&/^\d+(?:\.\d+)?%?$/.test(parts[1])){title=parts[0];earned=Number(parts[1].replace('%',''));category=parts[2]||category;date=skyDate(parts[3]);}
      }
    }
    if(!title||!Number.isFinite(earned)||earned<0||!Number.isFinite(possible)||possible<=0)continue;
    if(/^(major grade|minor grade|other grade|total|average)$/i.test(title.trim()))continue;
    rows.push({title:title.trim(),date:date||localDate(),earned,possible,sourceCategory:category||'Unlabeled',categoryId:guessCat(c,category,title),checked:true});
  }
  return rows;
}
function bulkImport(cid){const c=classById(cid);if(!c)return;bulkRows=[];
 modal('Import grades into '+c.name,`<p class="muted small">Copy assignment rows from Skyward and paste below, or choose a screenshot. Screenshot text recognition is experimental; carefully review every grade before saving.</p>
 <div class="field"><label>Paste grades from Skyward or a list</label><textarea id="bulkText" rows="7" placeholder="Unit 3.2 Test    11/06/2026    90    90.00%    90.00 / 100.00\nKinetics Test    11/19/2026    86    86.00%    86.00 / 100.00"></textarea></div>
 <p class="helper">Also accepts: Unit 3.2 Test | 90 | Major Grade. Skyward “Other Grade” can be mapped to your Homework category below. Your class category weights remain unchanged.</p>
 <div class="field"><label>Or select a screenshot (PNG/JPG)</label><input id="bulkImage" type="file" accept="image/png,image/jpeg,image/webp"></div>
 <div class="toolbar"><button class="btn" id="bulkOcr" type="button">🔎 Read screenshot</button><button class="btn primary" id="bulkPreview" type="button">Review pasted grades</button></div>
 <div id="bulkStatus" class="helper" style="margin:12px 0" aria-live="polite">Screenshots use Tesseract.js text recognition in your browser. Internet is required to load the OCR library the first time; the screenshot is not sent to an AI service.</div>
 <div id="bulkReview"></div><div class="form-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" id="bulkSave" disabled>Save reviewed grades</button></div>`);
 // Widen for editing and undo on modal close.
 document.querySelector('.modal').style.width='min(920px,100%)';
 document.getElementById('bulkPreview').onclick=()=>{bulkRows=parseBulk(document.getElementById('bulkText').value,c);renderBulkReview(c)};
 document.getElementById('bulkOcr').onclick=async()=>{
  const file=document.getElementById('bulkImage').files[0],status=document.getElementById('bulkStatus');if(!file){status.textContent='Choose a screenshot first.';return}
  if(file.size>12000000){status.textContent='Choose an image smaller than 12 MB.';return}
  status.textContent='Loading OCR and reading screenshot…';document.getElementById('bulkOcr').disabled=true;
  try{
    if(!window.Tesseract){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';script.onload=resolve;script.onerror=()=>reject(Error('Unable to load OCR library. Try copying the table instead.'));document.head.append(script)})}
    const result=await window.Tesseract.recognize(file,'eng');const txt=result.data.text||'';document.getElementById('bulkText').value=txt;bulkRows=parseBulk(txt,c);renderBulkReview(c);status.textContent=`OCR completed. Found ${bulkRows.length} possible grades; please correct anything it misread before saving.`;
  }catch(e){status.textContent='Screenshot reading failed: '+e.message+' You can paste rows manually instead.'}finally{document.getElementById('bulkOcr').disabled=false}
 };
 document.getElementById('bulkSave').onclick=e=>{e.preventDefault();saveBulk(c)};
}
function renderBulkReview(c){const slot=document.getElementById('bulkReview'),saveBtn=document.getElementById('bulkSave');if(!slot)return;
 if(!bulkRows.length){slot.innerHTML='<p class="notice">No assignment rows were recognized. Try copying the table as text, or use the simple “Name | 90 | Category” format.</p>';saveBtn.disabled=true;return}
 const labels=[...new Set(bulkRows.map(r=>r.sourceCategory))];
 const choices=catId=>`<option value="">Choose category…</option>${c.categories.map(cat=>`<option value="${esc(cat.id)}" ${catId===cat.id?'selected':''}>${esc(cat.name)}</option>`).join('')}`;
 slot.innerHTML=`<h3>Review before importing (${bulkRows.length} rows)</h3><div class="info" style="margin-bottom:12px"><strong>Skyward category mapping</strong><p class="small">Match each Skyward heading to your Classroom grading categories. “Other Grade” usually corresponds to Homework/Daily, but check your teacher’s grading setup. No categories or weights are changed automatically.</p><div class="mapping-grid">${labels.map((label,i)=>{const suggested=bulkRows.find(r=>r.sourceCategory===label)?.categoryId||'';return `<div class="field"><label for="bulkMap${i}">${esc(label)}</label><select id="bulkMap${i}" class="bulk-map" data-source="${esc(label)}">${choices(suggested)}</select></div>`}).join('')}</div><button type="button" id="applyMapping" class="btn sm">Apply mappings to rows</button></div><p class="helper">Check the assignment, category, date, and score on every row. Rows with no selected category cannot be saved.</p><div style="overflow-x:auto"><table class="grade-table"><thead><tr><th>Import</th><th>Assignment</th><th>Skyward</th><th>Classroom category</th><th>Date</th><th>Grade earned</th><th>Out of</th></tr></thead><tbody>${bulkRows.map((r,i)=>`<tr data-row="${i}"><td><input type="checkbox" class="bulk-check" ${r.checked?'checked':''}></td><td><input aria-label="Assignment ${i+1}" class="bulk-title" style="min-width:165px;width:100%" value="${esc(r.title)}"></td><td class="small">${esc(r.sourceCategory)}</td><td><select class="bulk-category">${choices(r.categoryId)}</select></td><td><input class="bulk-date" aria-label="Date" type="date" value="${esc(r.date)}"></td><td><input class="bulk-earned" aria-label="Grade earned" type="number" min="0" step="0.01" value="${r.earned}" style="width:80px"></td><td><input class="bulk-possible" aria-label="Grade out of" type="number" min="0.01" step="0.01" value="${r.possible}" style="width:80px"></td></tr>`).join('')}</tbody></table></div>`;
 document.getElementById('applyMapping').onclick=()=>{const mappings=new Map([...slot.querySelectorAll('.bulk-map')].map(x=>[x.dataset.source,x.value]));for(const row of slot.querySelectorAll('tr[data-row]')){const item=bulkRows[Number(row.dataset.row)];row.querySelector('.bulk-category').value=mappings.get(item.sourceCategory)||'';}};

 saveBtn.disabled=false;
}
function saveBulk(c){const rows=[...document.querySelectorAll('#bulkReview tr[data-row]')];let add=[],invalid=[];const old=new Set(data.grades.filter(g=>g.classId===c.id).map(g=>`${g.title.trim().toLowerCase()}|${g.date}|${g.categoryId}`));let duplicates=0;
 for(const r of rows){if(!r.querySelector('.bulk-check').checked)continue;const title=r.querySelector('.bulk-title').value.trim(),categoryId=r.querySelector('.bulk-category').value,date=r.querySelector('.bulk-date').value,earned=Number(r.querySelector('.bulk-earned').value),possible=Number(r.querySelector('.bulk-possible').value);if(!title||!date||!categoryId||!Number.isFinite(earned)||earned<0||!Number.isFinite(possible)||possible<=0){invalid.push(rows.indexOf(r)+1);continue}const key=`${title.toLowerCase()}|${date}|${categoryId}`;if(old.has(key)){duplicates++;continue}old.add(key);add.push({id:id(),classId:c.id,title,categoryId,date,pointsEarned:earned,pointsPossible:possible})}
 if(invalid.length){alert('Fix invalid rows before saving: '+invalid.join(', '));return}if(!add.length){alert('No new grades selected. '+duplicates+' duplicate(s) skipped.');return}
 if(!confirm(`Import ${add.length} grades into ${c.name}? ${duplicates} matching existing grade(s) will be skipped.`))return;
 data.grades.push(...add);save();closeModal();document.querySelector('.modal').style.width='';selectedClass=c.id;classTab='grades';go('classes');alert(`${add.length} grades imported. ${duplicates} duplicate(s) skipped. Please verify your class average against Skyward.`);
}

function organizeGrades(cid){const c=classById(cid);if(!c)return;const gs=data.grades.filter(g=>g.classId===c.id).slice().sort((a,b)=>(a.title||'').localeCompare(b.title||''));
 if(!gs.length){alert('There are no grades to organize yet.');return}
 modal('Organize grades — '+c.name,`<p class="info">Fix categories on grades you already imported. For example, change worksheets from Tests to Homework. This changes the calculated average; no grades are deleted.</p><div style="overflow-x:auto"><table class="grade-table"><thead><tr><th>Saved assignment</th><th>Grade</th><th>Category</th></tr></thead><tbody>${gs.map(g=>`<tr><td>${esc(g.title)}</td><td>${pct(gradePct(g))}</td><td><select class="organize-cat" data-grade="${esc(g.id)}">${c.categories.map(k=>`<option value="${esc(k.id)}" ${k.id===g.categoryId?'selected':''}>${esc(k.name)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><div class="form-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" id="saveCategories">Save categories</button></div>`);
 document.querySelector('.modal').style.width='min(850px,100%)';document.getElementById('saveCategories').onclick=()=>{for(const el of document.querySelectorAll('.organize-cat')){const g=data.grades.find(x=>x.id===el.dataset.grade);if(g)g.categoryId=el.value}save();closeModal();selectedClass=c.id;go('classes');alert('Grade categories updated. Compare your average to Skyward.')};
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-view]');if(!el)return;if(el.dataset.view){go(el.dataset.view);return}const a=el.dataset.action,i=el.dataset.id;switch(a){case'add-class':classForm();break;case'edit-class':classForm(i);break;case'open-class':selectedClass=i;classTab='grades';go('classes');break;case'back-classes':selectedClass=null;go('classes');break;case'add-category':document.getElementById('catRows').insertAdjacentHTML('beforeend',categoryLine());break;case'remove-category':el.closest('.weight-line').remove();break;case'add-grade':gradeForm(null,i);break;case'bulk-import':bulkImport(i);break;case'organize-grades':organizeGrades(i);break;case'edit-grade':gradeForm(i);break;case'add-task':taskForm();break;case'edit-task':taskForm(i);break;case'class-tab':classTab=i;renderClasses();break;case'whatif-calc':recalcWhatIf();break;case'target-calc':recalcTarget();break;case'task-filter':taskFilter=i;renderTasks();break;case'calendar-mode':calendarMode=i;renderCalendar();break;case'prev-week':weekStart.setDate(weekStart.getDate()-7);renderCalendar();break;case'next-week':weekStart.setDate(weekStart.getDate()+7);renderCalendar();break;case'prev-month':month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar();break;case'next-month':month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar();break;case'close-modal':closeModal();break;case'export':exportBackup();break;case'import':document.getElementById('importFile').click();break;case'reset':if(confirm('Permanently delete ALL saved classes, grades and homework on this browser? This cannot be undone unless you exported a backup.')){data=stateDefault();selectedClass=null;save();go('dashboard')}break;case'delete-class':if(confirm('Delete this class and all its saved grades? Homework will remain under General.')){data.classes=data.classes.filter(c=>c.id!==i);data.grades=data.grades.filter(g=>g.classId!==i);data.tasks.forEach(t=>{if(t.classId===i)t.classId=''});selectedClass=null;save();closeModal();go('classes')}break;case'delete-grade':if(confirm('Delete this saved grade?')){data.grades=data.grades.filter(g=>g.id!==i);save();closeModal();render()}break;case'delete-task':if(confirm('Delete this homework task?')){data.tasks=data.tasks.filter(t=>t.id!==i);save();closeModal();render()}break;}}
